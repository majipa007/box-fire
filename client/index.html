<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boxfire</title>
<style>
  :root { --bg: #14161b; --panel: #1f232b; --text: #e8e8e8; --dim: #8a909c; --accent: #f58231; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, sans-serif; overflow: hidden; }
  button { font: inherit; color: var(--text); background: var(--accent); border: 0; border-radius: 6px; padding: 8px 18px; cursor: pointer; }
  input { font: inherit; color: var(--text); background: var(--bg); border: 1px solid #3a3f4a; border-radius: 6px; padding: 8px 10px; }
  .screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  .card { background: var(--panel); border-radius: 10px; padding: 24px 28px; min-width: 320px; max-width: 92vw; }
  h1 { margin: 0 0 16px; letter-spacing: 0.04em; }
  #join-error { color: #ff6b6b; min-height: 1.4em; margin: 8px 0 0; }
  #lobby-players { list-style: none; padding: 0; margin: 0 0 16px; }
  #lobby-players li { display: flex; align-items: center; gap: 10px; padding: 4px 0; }
  .swatch { width: 14px; height: 14px; border-radius: 3px; flex: none; }
  .ping { margin-left: auto; color: var(--dim); font-size: 14px; }
  .dim { color: var(--dim); }
  .error { color: #ff6b6b; min-height: 1.4em; }
  #view { position: fixed; inset: 0; display: block; }
  #menu { background: rgba(10, 12, 16, 0.55); }
  #menu label { display: grid; grid-template-columns: 9em 1fr 3em; align-items: center; gap: 10px; margin: 10px 0; }
  #menu output { color: var(--dim); text-align: right; }
  #hud { position: fixed; inset: 0; pointer-events: none; }
  #crosshair { position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; background: #0f0; border-radius: 50%; }
  #hitmarker { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; opacity: 0; transition: opacity 0.15s; }
  #hitmarker::before, #hitmarker::after { content: ""; position: absolute; left: 10px; top: 0; width: 2px; height: 22px; background: currentColor; }
  #hitmarker::before { transform: rotate(45deg); }
  #hitmarker::after { transform: rotate(-45deg); }
  #hitmarker.show { opacity: 1; transition: none; }
  .hud-big { position: absolute; bottom: 18px; font: 600 30px system-ui, sans-serif; text-shadow: 0 1px 3px #000; }
  #hp { left: 24px; }
  #ammo { right: 24px; }
  #killfeed { position: absolute; top: 14px; right: 18px; list-style: none; margin: 0; padding: 0; text-align: right; font-size: 15px; }
  #killfeed li { background: rgba(0, 0, 0, 0.45); padding: 3px 9px; margin-bottom: 4px; border-radius: 4px; }
  #killfeed .mine { outline: 1px solid var(--accent); }
  #picker { position: absolute; left: 50%; top: 56%; transform: translateX(-50%); pointer-events: auto; background: rgba(15, 17, 22, 0.85); padding: 12px 16px; border-radius: 8px; text-align: center; }
  #picker button { margin: 6px 4px 0; background: #3a3f4a; }
  #picker button.chosen { background: var(--accent); }
  #matchinfo { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); font: 600 18px system-ui, sans-serif; text-shadow: 0 1px 3px #000; white-space: pre; }
  #scoreboard { pointer-events: none; }
  #scoreboard table { border-collapse: collapse; min-width: 340px; }
  #scoreboard th, #scoreboard td { padding: 5px 12px; text-align: right; }
  #scoreboard th:first-child, #scoreboard td:first-child { text-align: left; }
  #scoreboard tr.me td { color: var(--accent); }
  #scoreboard tr.gone td { color: var(--dim); }
  #death { position: absolute; left: 50%; top: 38%; transform: translateX(-50%); font: 600 26px system-ui, sans-serif; text-shadow: 0 1px 4px #000; text-align: center; }
  #stats { position: fixed; left: 8px; top: 8px; font: 12px monospace; color: #fff; background: rgba(0, 0, 0, 0.5); padding: 2px 6px; }
</style>
<script type="importmap">
  { "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }
</script>
</head>
<body>
<div id="hud" hidden>
  <div id="crosshair"></div>
  <div id="matchinfo"></div>
  <div id="hitmarker"></div>
  <div id="hp" class="hud-big"></div>
  <div id="ammo" class="hud-big"></div>
  <ul id="killfeed"></ul>
  <div id="death" hidden></div>
  <div id="picker" hidden>
    <div>Primary for your next spawn <span class="dim">(B to close)</span></div>
    <button id="pick-rifle">1 · Rifle</button><button id="pick-shotgun">2 · Shotgun</button>
  </div>
</div>
<div id="menu" class="screen" hidden>
  <div class="card">
    <h1 id="menu-title">Boxfire</h1>
    <label>Sensitivity <input id="set-sens" type="range" min="0.1" max="5" step="0.05"><output></output></label>
    <label>Field of view <input id="set-fov" type="range" min="70" max="110" step="1"><output></output></label>
    <p id="menu-error" class="error"></p>
    <button id="play">Click to play</button>
    <button id="end-match" hidden>End match</button>
  </div>
</div>
<div id="scoreboard" class="screen" hidden>
  <div class="card">
    <h1 id="sb-title">Scoreboard</h1>
    <p id="sb-sub" class="dim"></p>
    <table>
      <thead><tr><th>Player</th><th>Kills</th><th>Deaths</th><th>Ping</th></tr></thead>
      <tbody id="sb-rows"></tbody>
    </table>
  </div>
</div>
<div id="stats" hidden></div>
<div id="lobby" class="screen">
  <div class="card">
    <h1>Boxfire</h1>
    <form id="join-form">
      <input id="name" maxlength="16" placeholder="Your name" autocomplete="off" autofocus>
      <button>Join</button>
      <p id="join-error"></p>
    </form>
    <div id="lobby-room" hidden>
      <ul id="lobby-players"></ul>
      <button id="start" hidden>Start</button>
      <p id="lobby-status" class="dim"></p>
    </div>
  </div>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
